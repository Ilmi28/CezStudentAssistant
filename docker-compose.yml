services:
  api:
    container_name: cez-student-assistant-api
    env_file: src/CezStudentAssistant.API/.env.docker
    build:
      context: .
      dockerfile: src/CezStudentAssistant.API/Dockerfile
      args:
        - BUILD_CONFIGURATION=Debug
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: cez-student-assistant-frontend
    build:
      context: ./src/cez-student-assistant-app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./src/cez-student-assistant-app:/app:Z
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: cez-student-assistant-db
    environment:
      - POSTGRES_DB=CezStudentAssistantDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
        - "5432:5432"

volumes:
  postgres_data: